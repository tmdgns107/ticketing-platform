spring:
  application:
    name: ticketing-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ticketing}?rewriteBatchedStatements=true&serverTimezone=UTC
    username: ${DB_USER:ticketing}
    password: ${DB_PASSWORD:ticketing}
    hikari:
      # Pool sizing: keep it small and predictable. With virtual threads the
      # request layer no longer bounds DB concurrency, so the pool is the
      # backpressure point. Start from ~ (cores * 2) and tune with load tests.
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:10}
      connection-timeout: 3000
      max-lifetime: 590000
      keepalive-time: 120000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      max: 200
    accept-count: 100
  shutdown: graceful

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    com.ticketing: INFO
