spring:
  datasource:
    url: jdbc:mysql://localhost:13306/ticketing?rewriteBatchedStatements=true&serverTimezone=UTC
    username: ticketing
    password: ticketing
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 16379
  flyway:
    # `db/seed` holds repeatable dev-only fixtures; never added in prod profiles.
    locations: classpath:db/migration,classpath:db/seed

logging:
  level:
    com.ticketing: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
