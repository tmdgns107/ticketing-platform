spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///ticketing?TC_REUSABLE=true
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-secret-test-only-secret-0123456789
    issuer: ticketing-platform
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
