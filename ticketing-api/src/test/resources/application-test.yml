# Datasource + Redis are supplied by Testcontainers @ServiceConnection
# (see support/TestcontainersConfiguration).
spring:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # integration tests run against the same dev seed grid (schedule 1 -> 80 seats)
    locations: classpath:db/migration,classpath:db/seed

app:
  cors:
    allowed-origins: http://localhost:5173
  jwt:
    secret: test-only-secret-test-only-secret-0123456789
    issuer: ticketing-platform
    access-token-ttl: PT30M
    refresh-token-ttl: P14D
  reservation:
    hold-duration: PT5M
    default-lock-strategy: OPTIMISTIC
    optimistic-max-attempts: 3
    distributed-lock-ttl: PT3S
    expiry-scan-interval: PT1H
